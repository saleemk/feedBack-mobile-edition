[package]
name = "feedback-mobile-edition-setup-companion"
version = "0.1.0"
description = "Guided setup companion for fee[dB]ack Mobile Edition"
edition = "2021"

[lib]
name = "setup_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
dirs = "6.0.0"
reqwest = "0.13.4"
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = [] }
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }
