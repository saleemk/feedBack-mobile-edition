[package]
name = "feedback-mobile-edition-setup-companion"
version = "0.1.0"
description = "Guided setup companion for fee[dB]ack Mobile Edition"
edition = "2021"

[lib]
name = "setup_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = [] }
